<body>
<!-- CSS use is  for styling the HTML elements
        use  is two types: internal and external or Inline CSS  and style tag using -->
    
    <!-- Internal CSS -->
    <h1>This is a heading</h1>
    <p>This is a paragraph.</p>
    
    <!-- Inline CSS -->
    <h1 style="color: green; text-align: justify;">This is a  inline using css heading</h1>
    <p style="color: purple; font-size: 18px; text-align: justify;">This is a paragraph.</p>

    <!-- External CSS -->

    <hr>
    <h1> My  Name is  Ayush Rajput </h1>
    <p>I am a web developer.</p>
    <p>This is another paragraph.</p>
    <button>Click Me</button>
    <button>Cancel</button>
